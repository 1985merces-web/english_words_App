name: Flutter CI
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      - uses: subosito/flutter-action@v2
        with:
          # google_mobile_ads 7.x requires Dart 3.9 or later.
          flutter-version: '3.35.1'
          channel: stable
      - run: flutter pub get
      # The vendored Billing plugin has its own package-level test dependencies.
      # Analyze the application and its tests, not the plugin source tree.
      - run: flutter analyze --no-fatal-infos lib test
      - run: flutter test --no-pub
      - run: flutter build web --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
