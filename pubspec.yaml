name: english_words_app
description: A Flutter vocabulary trainer
publish_to: 'none'

version: 1.0.2+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  flutter_tts: ^4.0.2
  audio_session: ^0.1.18
  csv: ^5.0.2
  flutter_svg: ^2.0.10
  http: ^1.5.0
  url_launcher: ^6.3.0
  file_picker: ^10.3.8
  read_pdf_text: ^0.3.1
  archive: ^4.0.7
  xml: ^6.6.1
  google_mobile_ads: ^7.0.0
  in_app_purchase: ^3.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  in_app_purchase_android:
    path: packages/in_app_purchase_android

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/logoVO.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/data/sets/
    - assets/data/reader/
    - assets/icons/
    - assets/images/LogoMain.svg
    - assets/sounds/
