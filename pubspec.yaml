name: english_words_app
description: A Flutter vocabulary trainer
publish_to: 'none'

version: 1.0.1+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  flutter_tts: ^4.0.2
  audio_session: ^0.1.18
  csv: ^5.0.2
  flutter_svg: ^2.0.10
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/logoVO.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/sets/
    - assets/icons/
    - assets/images/LogoMain.svg
