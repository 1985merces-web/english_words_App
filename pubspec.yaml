name: english_words_app
description: A Flutter vocabulary trainer
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  flutter_tts: ^4.0.2
  csv: ^5.0.2
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sets/all_lists.csv
    - assets/icons/
    - assets/images/LogoMain.svg
